<style>
/* =====================================================================================
   inslopnia · shared design system
   Inlined into every timeline render (template.html) and the Explorer GUI (gui.html)
   at build/serve time, so outputs stay single-file. Edit THIS file to restyle both.

   Concept: «insomnia night shift» — a deep night sky lit by the amber sun from the logo.
   Night (dark) and Dawn (light) are both first-class themes. Change the look here:
     1. Fonts ............ --font-*
     2. Surfaces & ink ... --page … --muted (per theme)
     3. Accent ........... --accent* (the logo amber; try #4fd1c5 or #a78bfa for a twist)
     4. Data colours ..... --c-* (categorical, CVD-validated order) and status colours
     5. Shape ............ --radius*, --shadow*
   ===================================================================================== */

:root {
  /* 1 · fonts — system only, the files must work offline */
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-mono: "Cascadia Mono", "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;

  /* 5 · shape */
  --radius: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;

  /* ---------- Dawn (light) ---------- */
  color-scheme: light;
  --page: #f4efe6;
  --glow-1: rgba(255, 168, 46, .22);
  --glow-2: rgba(120, 104, 230, .10);
  --surface: #fffcf6;
  --surface-2: #f3ece0;
  --surface-3: #e8dfcf;
  --glass: rgba(255, 252, 246, .74);
  --ink: #1d1a15;
  --ink-2: #5a5247;
  --muted: #8d8475;
  --grid: #e7dfd1;
  --axis: #cdc2ae;
  --ring: rgba(46, 36, 20, .10);
  --hl: rgba(232, 144, 12, .10);
  --lane-alt: rgba(46, 36, 20, .028);
  --shadow-sm: 0 1px 2px rgba(60, 40, 10, .06);
  --shadow: 0 1px 2px rgba(60, 40, 10, .05), 0 10px 30px -12px rgba(60, 40, 10, .18);
  --shadow-lg: 0 20px 60px -20px rgba(60, 40, 10, .35);

  /* 3 · accent: the sun */
  --accent: #e08a00;
  --accent-2: #ffb547;
  --accent-ink: #2a1800;
  --accent-soft: rgba(224, 138, 0, .13);
  --sun-glow: 0 0 0 1px rgba(224, 138, 0, .25), 0 0 24px -4px rgba(255, 170, 40, .55);

  /* 4 · data colours (light steps) */
  --c-blue: #2a78d6; --c-orange: #eb6834; --c-aqua: #1baf7a; --c-yellow: #eda100;
  --c-magenta: #e87ba4; --c-green: #008300; --c-violet: #6250d6; --c-red: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --neutral: #b3ab9c; --cancel: #6f6a60;
}

/* ---------- Night (dark) — OS preference unless the viewer forced light ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #080b12;
    --glow-1: rgba(255, 158, 31, .13);
    --glow-2: rgba(96, 86, 230, .16);
    --surface: #10141d;
    --surface-2: #171c27;
    --surface-3: #1f2532;
    --glass: rgba(14, 18, 26, .72);
    --ink: #eef1f6;
    --ink-2: #b4bbc9;
    --muted: #7a8394;
    --grid: #1c2230;
    --axis: #2b3242;
    --ring: rgba(255, 255, 255, .075);
    --hl: rgba(255, 173, 51, .10);
    --lane-alt: rgba(255, 255, 255, .022);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow: 0 1px 1px rgba(0, 0, 0, .35), 0 14px 40px -18px rgba(0, 0, 0, .8);
    --shadow-lg: 0 24px 70px -20px rgba(0, 0, 0, .9);
    --accent: #ffad33;
    --accent-2: #ffd27a;
    --accent-ink: #1d1200;
    --accent-soft: rgba(255, 173, 51, .14);
    --sun-glow: 0 0 0 1px rgba(255, 173, 51, .35), 0 0 28px -4px rgba(255, 166, 31, .6);
    --c-blue: #3987e5; --c-orange: #d95926; --c-aqua: #199e70; --c-yellow: #c98500;
    --c-magenta: #d55181; --c-green: #008300; --c-violet: #9085e9; --c-red: #e66767;
    --neutral: #485063; --cancel: #8a909c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #080b12;
  --glow-1: rgba(255, 158, 31, .13);
  --glow-2: rgba(96, 86, 230, .16);
  --surface: #10141d;
  --surface-2: #171c27;
  --surface-3: #1f2532;
  --glass: rgba(14, 18, 26, .72);
  --ink: #eef1f6;
  --ink-2: #b4bbc9;
  --muted: #7a8394;
  --grid: #1c2230;
  --axis: #2b3242;
  --ring: rgba(255, 255, 255, .075);
  --hl: rgba(255, 173, 51, .10);
  --lane-alt: rgba(255, 255, 255, .022);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 1px 1px rgba(0, 0, 0, .35), 0 14px 40px -18px rgba(0, 0, 0, .8);
  --shadow-lg: 0 24px 70px -20px rgba(0, 0, 0, .9);
  --accent: #ffad33;
  --accent-2: #ffd27a;
  --accent-ink: #1d1200;
  --accent-soft: rgba(255, 173, 51, .14);
  --sun-glow: 0 0 0 1px rgba(255, 173, 51, .35), 0 0 28px -4px rgba(255, 166, 31, .6);
  --c-blue: #3987e5; --c-orange: #d95926; --c-aqua: #199e70; --c-yellow: #c98500;
  --c-magenta: #d55181; --c-green: #008300; --c-violet: #9085e9; --c-red: #e66767;
  --neutral: #485063; --cancel: #8a909c;
}

/* =============================== base =============================== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font: 14px/1.5 var(--font-ui);
  background-color: var(--page);
  background-image:
    radial-gradient(1100px 520px at 8% -8%, var(--glow-1), transparent 62%),
    radial-gradient(900px 600px at 105% 0%, var(--glow-2), transparent 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
body > * { position: relative; z-index: 1; }
::selection { background: var(--accent); color: var(--accent-ink); }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
* { scrollbar-width: thin; scrollbar-color: var(--axis) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--axis); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .005em; margin: 0; }
.mono, .tnum { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sub { color: var(--ink-2); font-size: 13px; }

/* eyebrow: small caps label above a heading */
.eyebrow {
  font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 10px;
}
.eyebrow::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--accent-soft), transparent); }
.eyebrow.plain::after { display: none; }
.section-title { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 14px; flex-wrap: wrap; }
.section-title h2 { font-size: 22px; }
.section-title .note { color: var(--muted); font-size: 12.5px; }

/* =============================== components =============================== */
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 20px; }
.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); }

button, select, input, textarea {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--ring); border-radius: 999px; padding: 6px 13px; transition: background .15s, border-color .15s, box-shadow .15s;
}
input[type=search], textarea, select { border-radius: var(--radius-sm); }
textarea { border-radius: var(--radius-md); }
button { cursor: pointer; }
button:hover { background: var(--hl); border-color: color-mix(in srgb, var(--accent) 35%, var(--ring)); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on, button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
button.icon { width: 34px; height: 34px; padding: 0; display: inline-grid; place-items: center; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--ring); white-space: nowrap; cursor: pointer; user-select: none;
  transition: background .15s, opacity .15s;
}
.chip:hover { background: var(--hl); }
.chip.on { background: var(--ink); color: var(--surface); border-color: transparent; }
.chip.off { opacity: .38; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

/* brand lockup */
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 72px; height: 40px; flex: none; overflow: visible; }
.brand-word {
  font-family: var(--font-display); font-stretch: condensed; font-style: italic; font-weight: 300;
  font-size: 28px; letter-spacing: .05em; line-height: 1; color: var(--ink);
}
.brand-sub {
  font-family: var(--font-display); font-size: 11px; color: var(--muted); letter-spacing: .2em; text-transform: uppercase;
  padding-left: 12px; border-left: 1px solid var(--axis); line-height: 1.2;
}

/* KPI tile */
.kpi {
  position: relative; overflow: hidden; background: var(--surface-2); border: 1px solid var(--ring);
  border-radius: var(--radius-md); padding: 12px 14px 12px;
}
.kpi .l { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-family: var(--font-display); }
.kpi .v { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.15; margin-top: 4px; letter-spacing: .01em; }
.kpi .v small { font-size: 16px; color: var(--muted); font-weight: 400; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi .viz { margin-top: 8px; display: block; width: 100%; height: 26px; }

/* verdict stamp */
.stamp {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; font-size: 13px;
  padding: 6px 14px; border: 1.5px solid currentColor; border-radius: 999px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center;
  background: color-mix(in srgb, currentColor 9%, transparent);
}
.stamp.solved { color: var(--good); } .stamp.unsolved { color: var(--critical); } .stamp.partial { color: var(--warning); }
.stamp.abandoned { color: var(--cancel); } .stamp.in_progress, .stamp.none { color: var(--c-blue); }

/* outcome pill (lists) */
.oc { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; letter-spacing: .02em; }
.oc::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.oc.solved { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.oc.unsolved { color: var(--critical); background: color-mix(in srgb, var(--critical) 14%, transparent); }
.oc.partial { color: #a37000; background: color-mix(in srgb, var(--warning) 22%, transparent); }
.oc.abandoned { color: var(--cancel); background: color-mix(in srgb, var(--cancel) 16%, transparent); }
.oc.in_progress, .oc.none { color: var(--muted); background: color-mix(in srgb, var(--neutral) 22%, transparent); }

/* tables */
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
th {
  text-align: left; font-weight: 600; color: var(--muted); font-family: var(--font-display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  border-bottom: 1px solid var(--axis); padding: 9px 10px; position: sticky; top: 0; background: var(--surface); z-index: 1; white-space: nowrap;
}
td { border-bottom: 1px solid var(--grid); padding: 7px 10px; vertical-align: top; }
td.n, td.t { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.n { text-align: right; } td.t { color: var(--muted); }
tr.r { cursor: pointer; transition: background .12s; } tr.r:hover td { background: var(--hl); }

/* tooltip & drawer */
.tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: var(--ink); border: 1px solid var(--ring); box-shadow: var(--shadow-lg); border-radius: 12px; padding: 9px 12px; font-size: 12px; max-width: 440px; display: none;
}
.tip b { font-weight: 650; } .tip .tm { color: var(--muted); font-size: 11px; font-family: var(--font-mono); }

pre, code { font-family: var(--font-mono); }
.empty { color: var(--muted); font-size: 13px; padding: 28px; text-align: center; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }


/* =============================== session page =============================== */
.wrap { max-width: 1520px; margin: 0 auto; padding: 24px 22px 90px; }
section { margin-top: 22px; scroll-margin-top: 84px; }

/* hero */
.hero { padding: 20px 24px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.hero-main { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-top: 18px; flex-wrap: wrap; }
.hero-text { min-width: 0; flex: 1 1 520px; }
.hero h1 { font-size: clamp(26px, 3vw, 38px); line-height: 1.1; letter-spacing: -.005em; }
.hero .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 6px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; }
.hero-foot { display: grid; grid-template-columns: minmax(0, auto) 1fr; gap: 12px; margin-top: 14px; align-items: start; }
.flagbox {
  font-family: var(--font-mono); font-size: 13px; padding: 10px 14px; border-radius: var(--radius-md); word-break: break-all;
  background: linear-gradient(90deg, var(--accent-soft), transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--ring));
  display: flex; gap: 10px; align-items: center;
}
.flagbox b { color: var(--accent); font-family: var(--font-display); letter-spacing: .12em; font-size: 11px; }
.summary {
  white-space: pre-wrap; color: var(--ink-2); font-size: 13px; max-height: 4.6em; overflow: hidden; cursor: pointer; padding: 10px 14px;
  border-radius: var(--radius-md); background: var(--surface-2); border: 1px solid var(--ring);
  -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent); mask-image: linear-gradient(180deg, #000 60%, transparent);
}
.summary.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
@media (max-width: 800px) { .hero-foot { grid-template-columns: 1fr; } }
/* embedded in the Explorer: the host app already shows brand + theme switch */
.embed .hero-top, .embed .hero-main { display: none; }
.embed .kpis { margin-top: 0; }
.embed .wrap { padding-top: 16px; }

.section-title .sp { flex: 1; }
.tools { display: flex; gap: 6px; align-items: center; }
.tools button { padding: 4px 11px; }
.tools button.icon { width: 30px; height: 30px; }
.tnow { font-family: var(--font-mono); font-weight: 600; color: var(--accent); min-width: 78px; font-variant-numeric: tabular-nums; }

/* event-kind filter + the few line/marker meanings */
.kinds { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.legend { display: inline-flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-left: auto; align-items: center; order: 99; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* timeline */
.tl { display: grid; grid-template-columns: 252px 1fr; border: 1px solid var(--ring); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
.tl-labels { border-right: 1px solid var(--grid); background: linear-gradient(90deg, var(--surface-2), var(--surface)); }
.tl-scroll { overflow-x: auto; overflow-y: hidden; position: relative; }
#tl { display: block; }
.lab { display: flex; align-items: center; gap: 9px; padding: 0 12px; font-size: 12px; overflow: hidden; cursor: pointer; transition: background .12s; }
.lab:hover { background: var(--hl); }
.lab .role { font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: .06em; min-width: 26px; text-align: center; padding: 2px 5px; border-radius: 6px; color: #fff; flex: none; }
.lab .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab .meta { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); }
.lab.group { font-family: var(--font-display); font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; cursor: default; }
.lab.group:hover { background: none; }
svg text { font-family: var(--font-ui); }
.ax text { font-size: 11px; fill: var(--muted); font-family: var(--font-mono); }
.mk { cursor: pointer; }
.mk:hover { filter: brightness(1.15); }
.dim { opacity: .12; }
#cur { stroke: var(--accent); }
#curh { fill: var(--accent); }

/* DAG */
.dag-grid { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 14px; align-items: start; }
.dag-box {
  border: 1px solid var(--ring); border-radius: var(--radius-md); overflow: auto; min-height: 280px; max-height: 660px; position: relative;
  background: var(--surface);
}
.revs { border: 1px solid var(--ring); border-radius: var(--radius-md); background: var(--surface); overflow: auto; max-height: 560px; }
.rev { display: grid; grid-template-columns: 64px 20px 1fr; gap: 6px; padding: 7px 12px; border-bottom: 1px solid var(--grid); font-size: 12px; cursor: pointer; align-items: start; transition: background .12s; }
.rev:hover { background: var(--hl); }
.rev.cur { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.rev.future { opacity: .42; }
.rev .t { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; }
.rev .who { font-weight: 650; }
.scrub { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.scrub input[type=range] { flex: 1; min-width: 220px; accent-color: var(--accent); background: transparent; border: none; padding: 0; }
.node { cursor: pointer; }
.node text { font-size: 11px; fill: var(--ink-2); }
.node .nid { font-size: 12.5px; font-weight: 650; fill: var(--ink); font-family: var(--font-display); letter-spacing: .02em; }
.changed { stroke-opacity: .7; }

/* incidents & hypotheses */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.inc {
  border: 1px solid var(--ring); border-radius: var(--radius-md); padding: 12px 14px 12px 16px; margin-bottom: 10px; cursor: pointer;
  background: var(--surface); position: relative; overflow: hidden; transition: background .12s;
}
.inc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--sevc, var(--critical)); }
.inc:hover { background: var(--hl); }
.inc .tt { font-weight: 650; margin-top: 6px; }
.inc .d { color: var(--ink-2); font-size: 12.5px; margin-top: 3px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.row-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.sev { font-family: var(--font-display); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; color: #fff; }
.sev.low { background: var(--neutral); color: var(--ink); } .sev.medium { background: var(--warning); color: #1d1200; }
.sev.high { background: var(--serious); color: #1d1200; } .sev.critical { background: var(--critical); }
.st { font-size: 11px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--ring); color: var(--ink-2); }
.hyp { padding: 10px 12px; border-bottom: 1px solid var(--grid); cursor: pointer; border-radius: 8px; transition: background .12s; }
.hyp:hover { background: var(--hl); }
.hyp.refuted .claim { text-decoration: line-through; color: var(--muted); }
.hyp .claim { margin-top: 4px; }

/* log */
.logwrap { max-height: 580px; overflow: auto; border: 1px solid var(--ring); border-radius: var(--radius-md); background: var(--surface); }
.filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.filters input[type=search] { min-width: 240px; }

/* drawer */
#drawer {
  position: fixed; right: 12px; top: 12px; bottom: 12px; width: min(580px, calc(100vw - 24px)); border: 1px solid var(--ring); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); transform: translateX(calc(100% + 24px)); transition: transform .22s cubic-bezier(.2, .8, .2, 1); z-index: 60; display: flex; flex-direction: column;
}
#drawer.open { transform: none; }
#drawer .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--grid); }
#drawer .dh b { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
#drawer .db { padding: 16px 18px; overflow: auto; font-size: 13px; }
#drawer pre { white-space: pre-wrap; word-break: break-word; background: var(--surface-2); padding: 12px; border-radius: 10px; font-size: 12px; border: 1px solid var(--ring); }
#drawer h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 18px 0 8px; }
.kv { display: grid; grid-template-columns: 116px 1fr; gap: 5px 12px; font-size: 12.5px; }
.kv div:nth-child(odd) { color: var(--muted); }
@media (max-width: 960px) { .dag-grid, .two { grid-template-columns: 1fr; } .tl { grid-template-columns: 160px 1fr; } }
</style>

const OPS = M.dag_ops.slice().sort((a,b)=>a.t-b.t);
function dagAt(T){
  const st = {}; let last = -1;
  OPS.forEach((o,i)=>{ if(o.t> T + 1e-6) return; last=i;
    let n = st[o.node]; if(!n) n = st[o.node] = {id:o.node, status:"pending", deps:[], objective:"", assignee:null, attempts:0, removed:false, reason:null, touched:o.t};
    if(o.op==="add" && n.removed){ n.removed=false; n.status="pending"; n.reason=null; }  // re-added after removal
    if(o.objective) n.objective=o.objective; if(o.assignee) n.assignee=o.assignee;
    if(o.deps && (o.op==="add"||o.op==="update")) n.deps=o.deps.slice();
    if(o.op==="dep_add") (o.deps||[]).forEach(d=>{ if(!n.deps.includes(d)) n.deps.push(d); });
    if(o.op==="dep_rm") n.deps=n.deps.filter(d=>!(o.deps||[]).includes(d));
    if(o.op==="status"){ n.status=o.status; if(o.status==="running") n.attempts++; n.reason=o.reason||null; }
    if(o.op==="remove") n.removed=true;
    n.touched=o.t; n.lastOp=o;
  });
  return {nodes:st, last};
}

function drawProgress(g){
  const y0=progTop+PROG_H, top=progTop; const max=Math.max(1,...progSeries.map(p=>Object.values(p.c).reduce((a,b)=>a+b,0)));

function opLabel(o){
  switch(o.op){
    case "add": return `+ ${o.node}${o.deps&&o.deps.length?" ← "+o.deps.join(","):""}${o.objective?": "+clip(o.objective,90):""}`;
    case "status": return `${o.node}: ${(STATUS[o.prev]||[0,o.prev||"?"])[1]} → ${(STATUS[o.status]||[0,o.status])[1]}${o.reason?" ("+clip(o.reason,80)+")":""}`;
    case "update": return `~ ${o.node}${o.fields?" ["+o.fields.join(",")+"]":""}${o.deps?" deps→"+(o.deps.join(",")||"∅"):""}${o.note?": "+clip(o.note,80):""}`;
    case "remove": return `⌫ ${o.node}${o.reason?" ("+clip(o.reason,80)+")":""}`;
    case "dep_add": return `+ ребро ${(o.deps||[]).join(",")} → ${o.node}`;
    case "dep_rm": return `− ребро ${(o.deps||[]).join(",")} → ${o.node}`;
  } return o.op+" "+o.node;
}

/* ---------- DAG view ---------- */
const NW=230, NH=74, CG=64, RG=16, MAXCOL=7;
const allNodes = M.nodes.slice().sort((a,b)=>a.added-b.added);
const layout = (()=>{ const by={}; allNodes.forEach(n=>by[n.id]=n); const depth={};
  // union of all deps ever seen for stable layout
  const deps={}; allNodes.forEach(n=>deps[n.id]=new Set(n.deps)); OPS.forEach(o=>{ if(o.deps&&deps[o.node]) o.deps.forEach(d=>deps[o.node].add(d)); });
  const d=(id,seen)=>{ if(depth[id]!=null) return depth[id]; if(seen.has(id)) return 0; seen.add(id); const ds=[...(deps[id]||[])].filter(x=>by[x]); depth[id]= ds.length? 1+Math.max(...ds.map(x=>d(x,seen))) : 0; return depth[id]; };
  allNodes.forEach(n=>d(n.id,new Set()));
  const layers={}; allNodes.forEach(n=>(layers[depth[n.id]]=layers[depth[n.id]]||[]).push(n));
  const pos={}; let col=0, maxRows=0;
  Object.keys(layers).map(Number).sort((a,b)=>a-b).forEach(L=>{ const arr=layers[L]; for(let i=0;i<arr.length;i+=MAXCOL){ const chunk=arr.slice(i,i+MAXCOL); chunk.forEach((n,j)=>pos[n.id]={x:20+col*(NW+CG), y:20+j*(NH+RG)}); maxRows=Math.max(maxRows,chunk.length); col++; } });
  return {pos, w:40+col*(NW+CG)-CG, h:40+maxRows*(NH+RG)-RG};
})();
function drawDag(){
  const svg=$("#dag"); svg.innerHTML="";
  if(!allNodes.length){ $("#dag-box").innerHTML='<div class="empty">DAG не записан</div>'; return; }
  svg.setAttribute("width",Math.max(layout.w,300)); svg.setAttribute("height",Math.max(layout.h,200));
  const defs=S("defs",{},svg); const mk=S("marker",{id:"arr",viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto-start-reverse"},defs); S("path",{d:"M0,0L10,5L0,10z",fill:"var(--axis)"},mk);
  const st=dagAt(cursor); const lastOp = st.last>=0? OPS[st.last] : null;
  const gE=S("g",{},svg), gN=S("g",{},svg);
  allNodes.forEach(n=>{ const s=st.nodes[n.id]; if(!s) return; const p=layout.pos[n.id];
    s.deps.forEach(dp=>{ const q=layout.pos[dp]; if(!q||!st.nodes[dp]) return; const x1=q.x+NW, y1=q.y+NH/2, x2=p.x, y2=p.y+NH/2;
      const path = x2>x1 ? `M${x1},${y1} C${x1+CG/2},${y1} ${x2-CG/2},${y2} ${x2-2},${y2}` : `M${q.x+NW/2},${q.y+NH} C${q.x+NW/2},${q.y+NH+30} ${p.x+NW/2},${p.y-30} ${p.x+NW/2},${p.y-2}`;
      S("path",{d:path,fill:"none",stroke:"var(--axis)","stroke-width":1.6,"marker-end":"url(#arr)",opacity:(s.removed||s.status==="cancelled")?.4:1},gE); });
  });
  allNodes.forEach(n=>{ const s=st.nodes[n.id]; const p=layout.pos[n.id];
    const g=S("g",{class:"node",transform:`translate(${p.x},${p.y})`},gN);
    if(!s){ S("rect",{width:NW,height:NH,rx:9,fill:"none",stroke:"var(--grid)","stroke-dasharray":"4 4"},g); S("text",{x:12,y:22,class:"nid",opacity:.35},g).textContent=n.id; S("text",{x:12,y:40,opacity:.45},g).textContent=`появится в T+${rel(n.added)}`; g.onclick=()=>{ setCursor(n.added); }; return; }
    const stt = s.removed? "removed" : s.status; const c=(STATUS[stt]||STATUS.pending)[0];
    const faded = s.removed || stt==="cancelled";
    S("rect",{width:NW,height:NH,rx:9,fill:"var(--surface)",stroke:focusStep===n.id?"var(--ink)":"var(--ring)","stroke-width":focusStep===n.id?2:1,opacity:faded?.55:1,"stroke-dasharray":s.removed?"4 4":null},g);
    S("rect",{x:0,y:0,width:6,height:NH,rx:3,fill:c,opacity:faded?.6:1},g);
    S("rect",{x:6,y:0,width:NW-6,height:NH,rx:9,fill:c,"fill-opacity":stt==="pending"?0.04:0.10},g);
    if(lastOp && lastOp.node===n.id) S("rect",{x:-4,y:-4,width:NW+8,height:NH+8,rx:12,fill:"none",stroke:c,"stroke-width":2.5,class:"changed"},g);
    S("text",{x:14,y:18,class:"nid",opacity:faded?.6:1},g).textContent=clip(n.id,30);
    const obj=s.objective||n.objective||""; S("text",{x:14,y:34},g).textContent=clip(obj,36); S("text",{x:14,y:47},g).textContent=clip(obj.slice(35),36);
    S("text",{x:14,y:65,"font-size":11,"font-weight":700,fill:c},g).textContent=(STATUS[stt]||STATUS.pending)[2]+" "+(STATUS[stt]||STATUS.pending)[1];
    S("text",{x:NW-10,y:65,"text-anchor":"end","font-size":10,fill:"var(--muted)"},g).textContent=[s.assignee?clip(s.assignee,18):null, s.attempts>1?`×${s.attempts}`:null].filter(Boolean).join(" · ");
    const evs=M.items.filter(i=>i.step===n.id && i.t<=cursor);
    g.addEventListener("mousemove",e=>showTip(e,`<b>${esc(n.id)}</b> · ${esc((STATUS[stt]||[0,stt])[1])}${s.assignee?` · ${esc(s.assignee)}`:""}<div class="tm">добавлен T+${rel(n.added)} (${esc(n.added_by||"?")}) · deps: ${esc(s.deps.join(", ")||"—")}</div>${esc(clip(obj,400))}${s.reason?`<div class="tm">${esc(clip(s.reason,300))}</div>`:""}<div class="tm">событий к этому моменту: ${evs.length}</div>`));
    g.addEventListener("mouseleave",hideTip);

  });
}

$("#theme").onclick=()=>{ const r=document.documentElement; const dark = r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark? "light":"dark"; try{localStorage.setItem("tl-theme",r.dataset.theme);}catch(e){} };
try{ const th=localStorage.getItem("tl-theme"); if(th) document.documentElement.dataset.theme=th; }catch(e){}
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(drawTimeline,120); });

drawTimeline(); setCursor(t1);
})();
